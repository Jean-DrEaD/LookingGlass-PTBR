name: Windows Build

on:
  push:
    branches: [android-br]
    tags: ['br*', 'alice_br_v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Build Windows (portátil)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bins

      - name: Montar pasta portátil
        shell: pwsh
        run: |
          $o = "dist/LookingGlass"; $r = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force "$o/tools" | Out-Null
          Copy-Item "$r/looking-glass.exe" $o
          Copy-Item "$r/setup.exe" "$o/Setup.exe"
          Copy-Item tools/windows_setup.ps1 "$o/tools/"
          Invoke-WebRequest https://www.7-zip.org/a/7zr.exe -OutFile "$o/tools/7zr.exe"
          foreach ($f in 'README.md','LEGAL.md','LICENSE-MIT','THIRD_PARTY_NOTICES.txt') {
            if (Test-Path $f) { Copy-Item $f $o }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: LookingGlass-windows
          path: dist/LookingGlass/
          if-no-files-found: error

      - name: ZIP e checksum da release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $n = "LookingGlass-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist/LookingGlass -DestinationPath "dist/$n"
          (Get-FileHash "dist/$n" -Algorithm SHA256).Hash.ToLower() + "  $n" | Out-File dist/SHA256SUMS-windows.txt -Encoding ascii

      - name: Nomes padronizados

        if: startsWith(github.ref, 'refs/tags/')

        shell: pwsh

        run: |

          New-Item rel -ItemType Directory -Force | Out-Null

          $z = Get-ChildItem -Recurse -Filter *.zip | ? { $_.FullName -notmatch '[\/]rel[\/]' } | Select-Object -First 1

          if (-not $z) { throw "ZIP não encontrado" }

          Copy-Item $z.FullName rel/LookingGlass-PTBR-Windows.zip

          $h = (Get-FileHash rel/LookingGlass-PTBR-Windows.zip SHA256).Hash.ToLower()

          "$h  LookingGlass-PTBR-Windows.zip" | Set-Content rel/LookingGlass-PTBR-Windows.zip.sha256 -Encoding ascii

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Looking Glass — Edição PT-BR

            Port de **American McGee's Alice** (engine Looking Glass) com tradução completa para português do Brasil.

            ### Downloads
            | Plataforma | Arquivo | Como usar |
            |---|---|---|
            | **Android** | `LookingGlass-*-android.apk` | Instale por cima da versão anterior, sem perder saves nem `.pk3`. |
            | **Windows** | `LookingGlass-windows-*.zip` | Extraia e abra `Setup.exe`, que baixa e instala o jogo em PT-BR. |

            ### Novidades
            - Launcher Android, editor de toque e mapeamento de controle totalmente em PT-BR.
            - Botão **Baixar jogo** no Android, com download direto pelo gerenciador do sistema.
            - Windows portátil com instalador gráfico: download, extração, resolução, controles e atalho.
            - Créditos atualizados (Player124413, skulitom/LookingGlass, tradução DrEaD), agora exibidos só na primeira abertura.
            - Correção de link do `sevenz-rust` no build Android.

            ### Requisitos
            Arquivos `pak0`, `pak1_large`, `pak2`, `pak3`, `pak4_*` e `pak5_mod` (.pk3). Confira os checksums em `SHA256SUMS*.txt`.
          name: Looking Glass PT-BR ${{ github.ref_name }}
          files: |
            rel/LookingGlass-PTBR-Windows.zip
            rel/LookingGlass-PTBR-Windows.zip.sha256
          generate_release_notes: true
