name: Android Build

on:
  push:
    tags: ['br*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    name: Build Android APK (ARM64 + ARMv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # Full history so the commit count (APK versionCode / visible version) grows per commit.
          fetch-depth: 0

      - name: Audit source tree
        run: python3 tools/check_source.py --worktree

      - name: Run packaging & Android setup tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust 1.86 with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build signed Android APK & native bundle
        run: python3 tools/package_android.py --target aarch64-linux-android --target armv7-linux-androideabi --require-apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload Android APK & checksums
        uses: actions/upload-artifact@v5
        with:
          name: LookingGlass-android
          path: |
            target/android-dist/LookingGlass-*-android.apk
            target/android-dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Looking Glass — Edição PT-BR

            Port de **American McGee's Alice** (engine Looking Glass) com tradução completa para português do Brasil.

            ### Downloads
            | Plataforma | Arquivo | Como usar |
            |---|---|---|
            | **Android** | `LookingGlass-*-android.apk` | Instale por cima da versão anterior, sem perder saves nem `.pk3`. |
            | **Windows** | `LookingGlass-windows-*.zip` | Extraia e abra `Setup.exe`, que baixa e instala o jogo em PT-BR. |

            ### Novidades
            - Launcher Android, editor de toque e mapeamento de controle totalmente em PT-BR.
            - Botão **Baixar jogo** no Android, com download direto pelo gerenciador do sistema.
            - Windows portátil com instalador gráfico: download, extração, resolução, controles e atalho.
            - Créditos atualizados (Player124413, skulitom/LookingGlass, tradução DrEaD), agora exibidos só na primeira abertura.
            - Correção de link do `sevenz-rust` no build Android.

            ### Requisitos
            Arquivos `pak0`, `pak1_large`, `pak2`, `pak3`, `pak4_*` e `pak5_mod` (.pk3). Confira os checksums em `SHA256SUMS*.txt`.
          files: |
            target/android-dist/LookingGlass-*-android.apk
            target/android-dist/SHA256SUMS.txt
